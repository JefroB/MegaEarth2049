<!doctype html><meta charset="utf-8"><style>body{background:#29353a;color:white;font:13px sans-serif;margin:10px}main{display:grid;grid-template-columns:repeat(5,200px);gap:8px}section{background:#40504b;height:205px;padding:5px}canvas{display:block;margin:auto}div{overflow-wrap:anywhere}</style><main><section><canvas width="180" height="150" data-src="../../img/titles1/Book.png" data-grid="1,1"></canvas><div>Book</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Castle.png" data-grid="1,1"></canvas><div>Castle</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/CrossedSwords.png" data-grid="1,1"></canvas><div>CrossedSwords</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Crystal.png" data-grid="1,1"></canvas><div>Crystal</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/DemonCastle.png" data-grid="1,1"></canvas><div>DemonCastle</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Devil.png" data-grid="1,1"></canvas><div>Devil</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Dragon.png" data-grid="1,1"></canvas><div>Dragon</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Fountain.png" data-grid="1,1"></canvas><div>Fountain</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Gates.png" data-grid="1,1"></canvas><div>Gates</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Hexagram.png" data-grid="1,1"></canvas><div>Hexagram</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Island.png" data-grid="1,1"></canvas><div>Island</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Night.png" data-grid="1,1"></canvas><div>Night</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Plain.png" data-grid="1,1"></canvas><div>Plain</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/SF_City.png" data-grid="1,1"></canvas><div>SF_City</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/SF_City_thumb.png" data-grid="1,1"></canvas><div>SF_City_thumb</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Sword.png" data-grid="1,1"></canvas><div>Sword</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Tower1.png" data-grid="1,1"></canvas><div>Tower1</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Tower2.png" data-grid="1,1"></canvas><div>Tower2</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Universe.png" data-grid="1,1"></canvas><div>Universe</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/Volcano.png" data-grid="1,1"></canvas><div>Volcano</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/World.png" data-grid="1,1"></canvas><div>World</div></section><section><canvas width="180" height="150" data-src="../../img/titles1/WorldMap.png" data-grid="1,1"></canvas><div>WorldMap</div></section></main><script>Promise.all([...document.querySelectorAll("canvas")].map(c=>new Promise(resolve=>{let im=new Image();im.onload=()=>{let g=c.dataset.grid.split(",").map(Number),w=im.width/g[0],h=im.height/g[1],s=Math.min(170/w,140/h,2);c.getContext("2d").drawImage(im,0,0,w,h,(180-w*s)/2,(150-h*s)/2,w*s,h*s);resolve()};im.onerror=()=>resolve();im.src=c.dataset.src}))).then(()=>window.ready=true)</script>
