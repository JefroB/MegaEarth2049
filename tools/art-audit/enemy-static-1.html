<!doctype html><meta charset="utf-8"><style>body{background:#29353a;color:white;font:13px sans-serif;margin:10px}main{display:grid;grid-template-columns:repeat(5,200px);gap:8px}section{background:#40504b;height:205px;padding:5px}canvas{display:block;margin:auto}div{overflow-wrap:anywhere}</style><main><section><canvas width="180" height="150" data-src="../../img/sv_enemies/Death.png" data-grid="1,1"></canvas><div>Death</div></section><section><canvas width="180" height="150" data-src="../../img/sv_enemies/Earthspirit.png" data-grid="1,1"></canvas><div>Earthspirit</div></section><section><canvas width="180" height="150" data-src="../../img/sv_enemies/Firespirit.png" data-grid="1,1"></canvas><div>Firespirit</div></section><section><canvas width="180" height="150" data-src="../../img/sv_enemies/Puppet.png" data-grid="1,1"></canvas><div>Puppet</div></section><section><canvas width="180" height="150" data-src="../../img/sv_enemies/SF_Doll.png" data-grid="1,1"></canvas><div>SF_Doll</div></section><section><canvas width="180" height="150" data-src="../../img/sv_enemies/SF_Parasite.png" data-grid="1,1"></canvas><div>SF_Parasite</div></section><section><canvas width="180" height="150" data-src="../../img/sv_enemies/SF_Thug.png" data-grid="1,1"></canvas><div>SF_Thug</div></section><section><canvas width="180" height="150" data-src="../../img/sv_enemies/Waterspirit.png" data-grid="1,1"></canvas><div>Waterspirit</div></section><section><canvas width="180" height="150" data-src="../../img/sv_enemies/Windspirit.png" data-grid="1,1"></canvas><div>Windspirit</div></section><section><canvas width="180" height="150" data-src="../../img/sv_enemies/colonial-soldier.png" data-grid="1,1"></canvas><div>colonial-soldier</div></section><section><canvas width="180" height="150" data-src="../../img/sv_enemies/mod_mimic_03.png" data-grid="1,1"></canvas><div>mod_mimic_03</div></section></main><script>Promise.all([...document.querySelectorAll("canvas")].map(c=>new Promise(resolve=>{let im=new Image();im.onload=()=>{let g=c.dataset.grid.split(",").map(Number),w=im.width/g[0],h=im.height/g[1],s=Math.min(170/w,140/h,2);c.getContext("2d").drawImage(im,0,0,w,h,(180-w*s)/2,(150-h*s)/2,w*s,h*s);resolve()};im.onerror=()=>resolve();im.src=c.dataset.src}))).then(()=>window.ready=true)</script>
