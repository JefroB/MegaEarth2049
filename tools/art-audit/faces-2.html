grid="4,2"></canvas><div>Soldiers</div></section><section><canvas width="180" height="150" data-src="../../img/faces/Soldiers2.png" data-grid="4,2"></canvas><div>Soldiers2</div></section><section><canvas width="180" height="150" data-src="../../img/faces/some_main_dudes.png" data-grid="4,2"></canvas><div>some_main_dudes</div></section><section><canvas width="180" height="150" data-src="../../img/faces/wolf_with_clothes1.png" data-grid="4,2"></canvas><div>wolf_with_clothes1</div></section><section><canvas width="180" height="150" data-src="../../img/faces/Zack.png" data-grid="4,2"></canvas><div>Zack</div></section><section><canvas width="180" height="150" data-src="../../img/faces/Zed.png" data-grid="4,2"></canvas><div>Zed</div></section></main><script>Promise.all([...document.querySelectorAll("canvas")].map(c=>new Promise(resolve=>{let im=new Image();im.onload=()=>{let g=c.dataset.grid.split(",").map(Number),w=im.width/g[0],h=im.height/g[1],s=Math.min(170/w,140/h,2);c.getContext("2d").drawImage(im,0,0,w,h,(180-w*s)/2,(150-h*s)/2,w*s,h*s);resolve()};im.onerror=()=>resolve();im.src=c.dataset.src}))).then(()=>window.ready=true)</script>
