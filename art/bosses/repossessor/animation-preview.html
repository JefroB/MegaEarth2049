<!doctype html><html lang="en"><meta charset="utf-8"><title>Repossessor — normal and damaged animation</title>
<style>body{margin:0;background:#171e25;color:#edf1f6;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{max-width:760px;padding:24px}canvas{width:100%;background:radial-gradient(ellipse at bottom,#475152,#202932);border-radius:12px}button,input,select{margin:8px;padding:9px}small{color:#bbc8d4}h1{font-size:24px}</style>
<main><h1>The Repossessor · clamp attack</h1><canvas width="720" height="430"></canvas><div><label>Phase <select id="phase"><option value="normal">Normal</option><option value="damaged">Damaged</option></select></label><button id="play">Pause</button><button id="step">Next frame</button><label>Speed <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"></label><span id="state"></span></div><p>Idle → wind-up → strike → recovery. Switch phases at any point to compare the same pose.</p><small>Both phases share a fixed planted-foot anchor and ground line. Art preview only; not yet installed in battle.</small></main>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const frames=[{name:'Idle',rect:[0,0,660,627],ms:950},{name:'Wind-up',rect:[660,0,594,627],ms:420},{name:'Strike',rect:[0,627,660,627],ms:110},{name:'Recovery',rect:[660,627,594,627],ms:260}];
const phases={normal:{src:'repossessor-attack-sheet-v2.png',anchors:[[137,584],[80,584],[137,542],[81,542]]},damaged:{src:'repossessor-attack-damaged.png',anchors:[[137.5,588],[81.5,586],[136.5,543],[82,543]]}};
let playing=true,index=0,elapsed=0,last=0;
function draw(){ctx.clearRect(0,0,720,430);const f=frames[index],phase=phases[document.querySelector('#phase').value],scale=.62,a=phase.anchors[index];ctx.strokeStyle='#6c7b7d';ctx.beginPath();ctx.moveTo(125,366);ctx.lineTo(510,366);ctx.stroke();ctx.drawImage(phase.image,...f.rect,180-a[0]*scale,365-a[1]*scale,f.rect[2]*scale,f.rect[3]*scale);document.querySelector('#state').textContent=f.name;}
function tick(t){const dt=last?Math.min(t-last,100):0;last=t;if(playing){elapsed+=dt*Number(document.querySelector('#speed').value);if(elapsed>=frames[index].ms){elapsed=0;index=(index+1)%frames.length;}}draw();requestAnimationFrame(tick);}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play';};document.querySelector('#step').onclick=()=>{playing=false;document.querySelector('#play').textContent='Play';index=(index+1)%frames.length;elapsed=0;draw();};document.querySelector('#phase').onchange=()=>draw();
Promise.all(Object.values(phases).map(p=>new Promise((resolve,reject)=>{p.image=new Image();p.image.onload=resolve;p.image.onerror=reject;p.image.src=p.src;}))).then(()=>requestAnimationFrame(tick)).catch(()=>{document.querySelector('#state').textContent='Could not load animation artwork.';});
</script></html>
