<!doctype html><html lang="en"><meta charset="utf-8"><title>Remaining miniboss animation review</title><style>body{background:#202b31;color:#f4ead7;font:17px system-ui;margin:24px}h1{font-size:24px}canvas{background:#394541;border:1px solid #688179;max-width:100%}button,select{font:inherit;margin:7px;padding:8px}p{max-width:860px}</style><h1>Spiders · SEAM-3000 · A.S.P. drone</h1><p>Organic crouch and lunge; fixed mechanical bodies; SEAM: advancing cloth folds, sliding needle, turning wheel, and travelling thread highlights.</p><select id="kind"></select><button id="play">Pause</button><button id="step">Next pose</button><button id="sewstep">Next sewing frame</button><select id="zoom"><option value="1">Battle size</option><option value="2">2× inspection</option></select><span id="label"></span><br><canvas width="960" height="500"></canvas><p id="status">Animation review uses the same renderer as battle.</p><script src="../../../js/plugins/ME_RemainingBosses.js"></script><script>
const g=document.querySelector('canvas').getContext('2d'),images={};let running=true,index=0,elapsed=0,clock=0,last=0;const stages=[{name:'Idle',ms:1100},{name:'Anticipation',ms:267},{name:'Strike / cloth feed',ms:650},{name:'Recovery',ms:200}];for(const [k,d] of Object.entries(ME_RemainingArt.definitions)){kind.add(new Option(k,k));if(!images[d.image]){const im=images[d.image]=new Image();im.src=d.image+'.png';}}kind.value='Seam';play.onclick=()=>{running=!running;play.textContent=running?'Pause':'Play'};step.onclick=()=>{running=false;play.textContent='Play';index=(index+1)%4;elapsed=0;draw()};sewstep.onclick=()=>{running=false;play.textContent='Play';index=2;elapsed=(elapsed+116.667)%466.668;draw()};zoom.onchange=draw;kind.onchange=()=>{index=0;elapsed=0;draw()};function draw(){g.clearRect(0,0,960,500);g.strokeStyle='#76958a';g.beginPath();g.moveTo(20,420);g.lineTo(940,420);g.stroke();const d=ME_RemainingArt.definitions[kind.value],im=images[d.image];if(im.complete){g.save();g.translate(440,420);g.scale(+zoom.value,+zoom.value);g.filter='hue-rotate('+d.hue+'deg)';ME_RemainingArt.draw(g,kind.value,im,index,(index===0?clock:elapsed)/16.667);g.restore();}label.textContent=stages[index].name;}function tick(t){const dt=last?Math.min(t-last,100):0;last=t;if(running){clock+=dt;elapsed+=dt;if(elapsed>=stages[index].ms){elapsed=0;index=(index+1)%4}}draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
