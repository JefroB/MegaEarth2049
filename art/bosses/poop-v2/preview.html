<!doctype html><meta charset="utf-8"><title>Poopoo Caca animation</title><style>body{background:#202b31;color:#f4ead7;font:18px system-ui;padding:24px}canvas{background:#394541;border:1px solid #688179}button,select{font:inherit;padding:8px;margin:8px}p{max-width:820px}</style><h1>Poopoo Caca & little turd</h1><p>Approved complete-character designs. The boss blinks; the minion makes a short attack hop. Bodies keep the same source pixels and scale.</p><button id="play">Pause</button><button id="step">Next frame</button><select id="zoom"><option value="1">Battle size</option><option value="2">2× inspection</option></select><span id="pose"></span><br><canvas width="960" height="540"></canvas><p>Installed for Poopoo Caca and Crap. The preview uses the same body and eye-mask renderer as the game.</p><script src="renderer.js"></script><script>
const g=document.querySelector('canvas').getContext('2d'),images={};let running=true,t=0,index=0;const frames=[{name:'Idle',blink:false,hop:0,ms:1600},{name:'Blink / anticipation',blink:true,hop:0,ms:120},{name:'Minion attack hop',blink:false,hop:9,ms:120},{name:'Landing',blink:false,hop:3,ms:100}];play.onclick=()=>{running=!running;play.textContent=running?'Pause':'Play'};step.onclick=()=>{running=false;play.textContent='Play';index=(index+1)%4;t=0;draw()};zoom.onchange=draw;function draw(){g.clearRect(0,0,960,540);g.strokeStyle='#738b80';g.beginPath();g.moveTo(20,470);g.lineTo(940,470);g.stroke();const f=frames[index];for(const [key,x] of [['Poop',320],['Turd',710]]){g.save();g.translate(x,470);g.scale(+zoom.value,+zoom.value);ME_PoopArt.draw(g,key,images,f.blink,key==='Turd'?f.hop:0);g.restore();}pose.textContent=f.name;}let last=0;function tick(now){if(running){t+=Math.min(now-last,100);if(t>frames[index].ms){t=0;index=(index+1)%4}}last=now;draw();requestAnimationFrame(tick)}Promise.all(['poop-master.png','turd-master.png','poop-blink.png'].map(f=>new Promise(resolve=>{const im=images[f]=new Image();im.onload=resolve;im.src=f}))).then(()=>requestAnimationFrame(tick));
</script>
