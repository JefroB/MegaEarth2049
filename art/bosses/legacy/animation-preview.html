<!doctype html><meta charset="utf-8"><title>Legacy miniboss animation review</title><style>body{background:#182229;color:#e3ece8;font:18px system-ui;margin:24px}canvas{background:#303d40;border:1px solid #607a75}button,select{font:inherit;margin:8px;padding:8px}</style><h1>Legacy miniboss animation review</h1><p>Fixed source parts and scale. Windup → strike → recovery. Turds intentionally hop; rigid bodies stay planted.</p><select id="kind"></select><button id="play">Pause</button><button id="step">Next pose</button><select id="zoom"><option value="1">Actual size</option><option value="2">2× inspection</option></select><span id="label"></span><br><canvas width="1000" height="600"></canvas><script src="../../../js/plugins/ME_LegacyBosses.js"></script><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),images={};let running=true,t=0,stage=0;for(const key in ME_Rigs.definitions){kind.add(new Option(key,key));const d=ME_Rigs.definitions[key];if(!images[d.image]){const im=new Image();im.src='../../../img/bosses/'+d.image+'.png';images[d.image]=im;}}play.onclick=()=>{running=!running;play.textContent=running?'Pause':'Play';};step.onclick=()=>{running=false;play.textContent='Play';stage=(stage+1)%4;t=0;};function draw(){if(running){t++;if(t>45){stage=(stage+1)%4;t=0;}}g.clearRect(0,0,c.width,c.height);g.strokeStyle='#76938a';g.beginPath();g.moveTo(0,510);g.lineTo(1000,510);g.stroke();g.save();g.translate(440,510);g.scale(+zoom.value,+zoom.value);const d=ME_Rigs.definitions[kind.value];for(const p of ME_Rigs.pose(kind.value,stage,t)){if(!p.visible)continue;const im=images[d.image];if(!im.complete)continue;g.save();g.translate(p.x,p.y);g.rotate(p.rotation);g.scale(p.scale*p.mirror,p.scale);g.drawImage(im,...p.rect,-p.pivot[0],-p.pivot[1],p.rect[2],p.rect[3]);g.restore();}g.restore();label.textContent=['Idle','Windup','Strike','Recovery'][stage];requestAnimationFrame(draw);}draw();
</script>
