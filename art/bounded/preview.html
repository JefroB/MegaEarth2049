<!doctype html><meta charset="utf-8"><title>Bounded additions — exact runtime cells</title><style>body{background:#182433;color:#eef4fa;font:16px system-ui;margin:24px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:#26394b;padding:14px;border-radius:8px}h2{font-size:17px;min-height:42px}.pair{display:flex;gap:10px;align-items:center}.sample{padding:6px;background:#f4ede1}.dark{background:#08121c}canvas{display:block;image-rendering:pixelated}.effect{margin-top:8px;background:#101b28}p{max-width:950px;line-height:1.5}</style><h1>Salvage, off-clock stories & combat states</h1><p>Each card samples the production IconSet at 32px and 3× on light and dark backgrounds. The larger view samples the exact 192px native effect cell. Measured crops preserve alpha and separate pieces.</p><p><a style="color:#9df" href="animations.html">Play the five native battle effects</a></p><div id="cards"></div><script>const rows=[{"name":"Dead Relay","id":2105,"pattern":0},{"name":"Crushed Servo","id":2106,"pattern":1},{"name":"Spent Power Cell","id":2107,"pattern":2},{"name":"Contaminated Sensor","id":2108,"pattern":3},{"name":"Cracked Coolant Filter","id":2109,"pattern":4},{"name":"Soot-Clogged Optics","id":2110,"pattern":5},{"name":"Joint Venture","id":2111,"pattern":6},{"name":"Pre-Existing Body","id":2112,"pattern":7},{"name":"Free Trial","id":2113,"pattern":8},{"name":"Off-Clock Cookbook","id":2114,"pattern":9},{"name":"Off-Clock Scrapbook","id":2115,"pattern":10},{"name":"Microwave Love Letter","id":2116,"pattern":11},{"name":"Paralysis","id":2117,"pattern":12},{"name":"Temporal Stasis","id":2118,"pattern":13},{"name":"Stone Skin","id":2119,"pattern":14},{"name":"Motor Recall","id":2120,"pattern":15},{"name":"Soft Reset","id":2121,"pattern":16},{"name":"Nerve Clamp","id":2122,"pattern":17},{"name":"Borrowed Second","id":2123,"pattern":18},{"name":"Stone Shield","id":2124,"pattern":19},{"name":"Release Motor Lock","id":2125,"pattern":20},{"name":"Shed Stone","id":2126,"pattern":21},{"name":"Break Stone","id":2127,"pattern":22},{"name":"Recycling","id":2128,"pattern":23}];const load=s=>new Promise(r=>{let i=new Image;i.onload=()=>r(i);i.src=s});(async()=>{const icons=await load('../../img/system/IconSet.png'),effects=await load('../../img/animations/ME_BoundedAdditions.png');for(const r of rows){let card=document.createElement('div');card.className='card';card.innerHTML='<h2>'+r.id+' · '+r.name+'</h2>';for(const dark of[false,true]){let pair=document.createElement('div');pair.className='pair sample'+(dark?' dark':'');for(const size of[32,96]){let c=document.createElement('canvas');c.width=c.height=size;let q=c.getContext('2d');q.imageSmoothingEnabled=false;q.drawImage(icons,r.id%16*32,Math.floor(r.id/16)*32,32,32,0,0,size,size);pair.append(c)}card.append(pair)}let c=document.createElement('canvas');c.className='effect';c.width=c.height=192;c.getContext('2d').drawImage(effects,r.pattern%5*192,Math.floor(r.pattern/5)*192,192,192,0,0,192,192);card.append(c);cards.append(card)}})();</script>
